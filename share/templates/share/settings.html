{% extends 'base.html' %}

{% block title %}การตั้งค่าระบบ - CS Dept Next{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-5">

    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-lg font-bold text-gray-800">การตั้งค่าระบบ & ธีม</h1>
            <p class="text-xs text-gray-400 mt-0.5">ปรับแต่งธีมการแสดงผลและโทนสีของระบบ</p>
        </div>
    </div>

    <!-- Form Card -->
    <form id="settings-form" method="POST" class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        {% csrf_token %}

        <div class="px-5 py-3.5 bg-gray-50 border-b border-gray-200">
            <h2 class="text-sm font-semibold text-gray-700 flex items-center">
                <i class="fa-solid fa-palette text-blue-500 mr-2"></i>
                ธีมและการแสดงผล (Theme & Appearance)
            </h2>
        </div>

        <div class="p-5 sm:p-6 space-y-6">

            <!-- 1. Theme Mode -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">
                    โหมดการแสดงผล (Display Mode)
                </label>
                <div class="grid grid-cols-2 gap-3 max-w-sm">
                    <button type="button" 
                            class="theme-mode-btn p-3 rounded-lg border flex items-center justify-center space-x-2 transition-all group border-blue-500 bg-blue-50 text-blue-600 font-medium ring-2 ring-blue-200" 
                            data-mode="light">
                        <i class="fa-solid fa-sun text-yellow-500 text-sm"></i>
                        <span class="text-xs">โหมดสว่าง</span>
                    </button>

                    <button type="button" 
                            class="theme-mode-btn p-3 rounded-lg border flex items-center justify-center space-x-2 transition-all group border-gray-200 hover:border-gray-300 text-gray-500 bg-white" 
                            data-mode="dark" disabled title="โหมดมืดยังไม่พร้อมใช้งาน">
                        <i class="fa-solid fa-moon text-indigo-400 text-sm"></i>
                        <span class="text-xs">โหมดมืด</span>
                    </button>
                </div>
                <input type="hidden" name="theme_mode" id="id_theme_mode" value="{{ profile.theme_mode|default:'light' }}">
            </div>

            <!-- 2. Accent Color Palette -->
            <div class="space-y-2 pt-2 border-t border-gray-100">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">
                    โทนสีหลักของระบบ (Accent Color)
                </label>
                <div class="flex flex-wrap gap-2.5" id="accent-picker">
                    <button type="button" 
                            data-keep-color
                            class="accent-color-btn flex items-center space-x-2 px-3.5 py-2 rounded-lg border transition-all text-xs cursor-pointer border-blue-500 bg-blue-50 text-blue-600 font-medium ring-2 ring-blue-200" 
                            data-color="blue">
                        <span data-keep-color class="w-3 h-3 rounded-full bg-blue-500 shadow-sm inline-block flex-shrink-0"></span>
                        <span>CS Blue</span>
                    </button>

                    <button type="button" 
                            data-keep-color
                            class="accent-color-btn flex items-center space-x-2 px-3.5 py-2 rounded-lg border transition-all text-xs cursor-pointer border-gray-200 hover:border-gray-300 text-gray-600 bg-white" 
                            data-color="indigo">
                        <span data-keep-color class="w-3 h-3 rounded-full bg-indigo-500 shadow-sm inline-block flex-shrink-0"></span>
                        <span>Royal Indigo</span>
                    </button>

                    <button type="button" 
                            data-keep-color
                            class="accent-color-btn flex items-center space-x-2 px-3.5 py-2 rounded-lg border transition-all text-xs cursor-pointer border-gray-200 hover:border-gray-300 text-gray-600 bg-white" 
                            data-color="emerald">
                        <span data-keep-color class="w-3 h-3 rounded-full bg-green-500 shadow-sm inline-block flex-shrink-0"></span>
                        <span>Emerald Forest</span>
                    </button>

                    <button type="button" 
                            data-keep-color
                            class="accent-color-btn flex items-center space-x-2 px-3.5 py-2 rounded-lg border transition-all text-xs cursor-pointer border-gray-200 hover:border-gray-300 text-gray-600 bg-white" 
                            data-color="rose">
                        <span data-keep-color class="w-3 h-3 rounded-full bg-rose-500 shadow-sm inline-block flex-shrink-0"></span>
                        <span>Rose Ruby</span>
                    </button>

                    <button type="button" 
                            data-keep-color
                            class="accent-color-btn flex items-center space-x-2 px-3.5 py-2 rounded-lg border transition-all text-xs cursor-pointer border-gray-200 hover:border-gray-300 text-gray-600 bg-white" 
                            data-color="amber">
                        <span data-keep-color class="w-3 h-3 rounded-full bg-yellow-500 shadow-sm inline-block flex-shrink-0"></span>
                        <span>Amber Sun</span>
                    </button>
                </div>
                <input type="hidden" name="accent_color" id="id_accent_color" value="{{ profile.accent_color|default:'blue' }}">
            </div>
        </div>

        <!-- Submit Footer -->
        <div class="px-5 py-3.5 bg-gray-50 border-t border-gray-200 flex items-center justify-end space-x-2.5">
            <a href="{% url 'item_list' %}" class="px-4 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm font-medium transition">
                ยกเลิก
            </a>
            <button type="submit" id="save-settings-btn" class="px-5 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium shadow-sm transition-all active:scale-95 flex items-center">
                <i class="fa-solid fa-check mr-1.5"></i>
                <span>บันทึกการตั้งค่า</span>
            </button>
        </div>
    </form>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const accentColorBtns = document.querySelectorAll('.accent-color-btn');
    const accentColorInput = document.getElementById('id_accent_color');

    accentColorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const color = btn.getAttribute('data-color');
            if (accentColorInput) accentColorInput.value = color;

            accentColorBtns.forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600', 'font-medium', 'ring-2', 'ring-blue-200');
                b.classList.add('border-gray-200', 'text-gray-600', 'bg-white');
            });
            btn.classList.remove('border-gray-200', 'text-gray-600', 'bg-white');
            btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600', 'font-medium', 'ring-2', 'ring-blue-200');
        });
    });
});
</script>
{% endblock %}
